; =========================================================================
; PlatformIO Configuration for DustGuard IoT Node
; Target Hardware: ESP32 DevKit V1 (or ESP32-3248S035) + ASAIR APM2000 + 3.5" TFT Touch (ILI9488/ST7796 + XPT2046)
; Resolution: 480x320 Landscape
; Project: Samsung Innovation Campus 2026 - Final Project IoT (STT: 11)
; =========================================================================

[platformio]
default_envs = esp32_tft_touch

[env:esp32_tft_touch]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D ARDUINOJSON_USE_LONG_LONG=1
    ; User Setup TFT_eSPI (Pinout cho ESP32 DevKit / 3.5" Touchscreen)
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=21
    -D SPI_FREQUENCY=27000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Compile-time DEMO_MODE: Disabled by default for real sensor production
    ; -D DUSTGUARD_DEMO_MODE=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    paulstoffregen/XPT2046_Touchscreen @ 0.0.0-alpha+sha.26b691b2c8
    bblanchon/ArduinoJson @ ^6.21.4
    WiFi
    HTTPClient
    WiFiClientSecure
    Wire
    SPI
