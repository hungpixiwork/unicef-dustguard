<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="APM2000 laser PM sensor">
  <!-- DustGuard Native SVG: cream APM2000-style laser PM module. CC0-1.0 -->
  <rect width="512" height="512" fill="#FDFBF7"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3EC"/>
      <stop offset="55%" stop-color="#EDE6DA"/>
      <stop offset="100%" stop-color="#D9D0C2"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9BFAF"/>
      <stop offset="100%" stop-color="#A89F90"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3530"/>
      <stop offset="100%" stop-color="#1C1916"/>
    </linearGradient>
    <radialGradient id="hole" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="70%" stop-color="#2E2A26"/>
      <stop offset="100%" stop-color="#4A453E"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#231b14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <ellipse cx="268" cy="430" rx="150" ry="22" fill="#231b14" opacity="0.10"/>
  <g filter="url(#soft)">
    <path d="M118 318 L168 358 L392 308 L342 268 Z" fill="url(#base)"/>
    <path d="M342 140 L392 180 L392 308 L342 268 Z" fill="url(#side)"/>
    <path d="M118 190 L168 230 L392 180 L342 140 Z" fill="#D4CBBC"/>
    <path d="M118 190 L168 150 L392 100 L342 140 Z" fill="url(#body)"/>
    <path d="M130 210 L175 245 L375 200" fill="none" stroke="#B7AD9E" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="235" cy="248" rx="38" ry="34" fill="url(#hole)"/>
    <ellipse cx="235" cy="248" rx="28" ry="25" fill="#0E0D0C"/>
    <ellipse cx="228" cy="240" rx="10" ry="8" fill="#3A3530" opacity="0.55"/>
    <ellipse cx="235" cy="198" rx="5" ry="4.5" fill="#2A2622"/>
